<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var primary = 'vibe-flows.vercel.app'
        var aliases = {
          'vibeflowe.vercel.app': 1,
          'vibeflows-app.vercel.app': 1,
          'vibeflowapp.vercel.app': 1,
          'vibeflowsapp.vercel.app': 1,
          'vibeflowsweb.vercel.app': 1,
        }
        if (aliases[location.hostname]) {
          location.replace(
            'https://' +
              primary +
              location.pathname +
              location.search +
              location.hash,
          )
          return
        }

        // Force asset/SW reset without wiping user prefs (onboarding, likes, Spotify).
        var WANT = 'vf-2026-08-09-ui-deploy'
        var KEY = 'vf-cache-bust'
        try {
          if (localStorage.getItem(KEY) === WANT) return
          localStorage.setItem(KEY, WANT)
        } catch (e) {
          /* ignore */
        }
        var done = function () {
          var u = new URL(location.href)
          u.searchParams.set('_vf', WANT)
          location.replace(u.toString())
        }
        var clear = Promise.resolve()
        try {
          if ('caches' in window) {
            clear = caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k)
                }),
              )
            })
          }
        } catch (e) {
          /* ignore */
        }
        clear
          .catch(function () {})
          .then(function () {
            if (!('serviceWorker' in navigator)) {
              done()
              return
            }
            return navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister()
                  }),
                )
              })
              .catch(function () {})
              .then(done)
          })
      })()
    </script>

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=13" />
